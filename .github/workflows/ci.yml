name: CI

on:
  push:
    branches:
      - main
      - 1.21.1/stable
      - 1.20.1/stable
  pull_request:
    branches:
      - main
      - 1.21.1/stable
      - 1.20.1/stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run verification
        run: ./gradlew --no-daemon clean build

      - name: Resolve and verify release files
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mc_version="$(awk -F= '$1 == "minecraft_version" { print $2 }' gradle.properties)"
          mod_version="$(awk -F= '$1 == "mod_version" { print $2 }' gradle.properties)"
          jar="build/libs/minesplat-fabric-${mc_version}-${mod_version}.jar"
          mrpack="build/distributions/minesplat-prism-${mc_version}-${mod_version}.mrpack"

          test -f "${jar}"
          test -f "${mrpack}"
          test ! -f "build/libs/minesplat-fabric-${mc_version}-${mod_version}-sources.jar" || \
            test "$(find build/libs -maxdepth 1 -type f -name 'minesplat-fabric-*.jar' ! -name '*-sources.jar' | wc -l)" -eq 1

          echo "jar=${jar}" >> "${GITHUB_OUTPUT}"
          echo "mrpack=${mrpack}" >> "${GITHUB_OUTPUT}"

      - name: Upload verified build
        uses: actions/upload-artifact@v7
        with:
          name: minesplat-build-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.artifacts.outputs.jar }}
            ${{ steps.artifacts.outputs.mrpack }}
